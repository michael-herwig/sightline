<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/vendor/codicons/codicon.css">
<style>[hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>
<title>Leerrohr- und Kameraplaner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f2f1ec;
    --panel: #ffffff;
    --panel-2: #f7f6f2;
    --line: #dcdad2;
    --line-2: #c9c7bf;
    --ink: #1f2430;
    --ink-2: #5c6270;
    --ink-3: #8a909c;
    --accent: #2452c9;
    --accent-soft: rgba(36, 82, 201, 0.12);
    --cam: #c8322e;
    --cam-soft: rgba(200, 50, 46, 0.14);
    --ap: #1f8a4c;
    --ap-soft: rgba(31, 138, 76, 0.14);
    --hub: #d9861b;
    --jb: #7c5cbf;
    --power: #6b7280;
    --warn: #b45309;
    --warn-soft: rgba(180, 83, 9, 0.12);
    --ok: #1f8a4c;
    --sel: #111827;
    /* Cluster marker: a map symbol, not a control — it sits on the aerial imagery
       and therefore stays dark in both themes. `--ink` flips to light gray in dark
       mode, and the white number was no longer legible against it. Like --cam/--ap/--jb
       a planner-only token; it does not live in src/layouts/Base.astro. */
    --cluster: #1f2430;
    --shadow: 0 1px 2px rgba(20, 24, 36, 0.08), 0 8px 24px rgba(20, 24, 36, 0.08);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15171c;
      --panel: #1e2128;
      --panel-2: #262a32;
      --line: #343944;
      --line-2: #444a57;
      --ink: #e8e9ec;
      --ink-2: #aab0bc;
      --ink-3: #7c8390;
      --accent: #6d8ff0;
      --accent-soft: rgba(109, 143, 240, 0.18);
      --cam: #e35b57;
      --cam-soft: rgba(227, 91, 87, 0.22);
      --ap: #3cb371;
      --ap-soft: rgba(60, 179, 113, 0.18);
      --hub: #f0a33a;
    --jb: #a78bfa;
      --jb: #a78bfa;
      --power: #9aa1ad;
      --warn: #f5a742;
      --warn-soft: rgba(245, 167, 66, 0.16);
      --ok: #3cb371;
      --sel: #ffffff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #15171c;
    --panel: #1e2128;
    --panel-2: #262a32;
    --line: #343944;
    --line-2: #444a57;
    --ink: #e8e9ec;
    --ink-2: #aab0bc;
    --ink-3: #7c8390;
    --accent: #6d8ff0;
    --accent-soft: rgba(109, 143, 240, 0.18);
    --cam: #e35b57;
    --cam-soft: rgba(227, 91, 87, 0.22);
    --ap: #3cb371;
    --ap-soft: rgba(60, 179, 113, 0.18);
    --hub: #f0a33a;
    --power: #9aa1ad;
    --warn: #f5a742;
    --warn-soft: rgba(245, 167, 66, 0.16);
    --ok: #3cb371;
    --sel: #ffffff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { height: 100%; display: flex; flex-direction: column; }

  /* Icons: Codicons throughout (MIT, vendored). Size via font-size, color inherits. */
  .codicon { font-size: 16px; line-height: 1; vertical-align: middle; }
  .tool .codicon, .btn.icon .codicon { font-size: 15px; }
  .ptool .codicon { font-size: 17px; }
  .projrow .del .codicon { font-size: 20px; }
  .projmenu > summary .codicon { font-size: 14px; }
  .lrow .del .codicon, .segs .seg .codicon { font-size: 14px; }
  /* Header */
  .top {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand { display: flex; flex-direction: column; margin-right: 8px; }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  .brand span { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tool {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; line-height: 1;
    border: 1px solid var(--line-2); background: var(--panel-2);
    font-size: 13px; font-weight: 500; color: var(--ink); text-decoration: none;
  }
  .tool:hover { border-color: var(--ink-3); color: var(--ink); }
  .tool[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .tool .k { font-family: var(--mono); font-size: 11px; opacity: 0.7; }
  .spacer { flex: 1; }
  .viewmenu { position: relative; }
  .viewmenu > summary { list-style: none; cursor: pointer; }
  .viewmenu > summary::-webkit-details-marker { display: none; }
  .viewmenu > summary::after { content: " ▾"; opacity: 0.6; }
  .viewlist {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 190px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); padding: 4px; display: flex; flex-direction: column; gap: 2px;
  }
  .viewlist button {
    text-align: left; border: 0; background: none; color: var(--ink);
    padding: 5px 8px; border-radius: 4px; font-size: 13px;
  }
  .viewlist button:hover { background: var(--panel-2); }
  .viewlist button .mk { color: var(--ok); margin-right: 6px; }
  .viewlist button.off .mk { visibility: hidden; }
  .viewlist hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; }
  /* Messages as a short toast at the bottom of the map; save status as a dot on the save button. */
  .toast {
    position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%) translateY(6px); z-index: 4;
    padding: 6px 12px; border-radius: 6px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); font-size: 12px; white-space: nowrap;
    box-shadow: var(--shadow); opacity: 0; visibility: hidden; transition: opacity .2s, transform .2s, visibility 0s linear .2s; pointer-events: none;
  }
  .toast.on { opacity: 1; visibility: visible; transform: translateX(-50%); transition-delay: 0s; }
  .toast.indlg { bottom: 8px; }
  dialog.toasting { padding-bottom: 44px; }
  #t-save { position: relative; }
  #t-save::after {
    content: ""; position: absolute; right: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--ap); transition: background .2s;
  }
  #t-save.dirty::after { background: var(--hub); }
  #t-save.fail::after { background: var(--cam); }
  .total-chip {
    font-family: var(--mono); font-size: 13px; font-weight: 500;
    padding: 6px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .total-chip.over { background: var(--warn-soft); color: var(--warn); }

  /* Main */
  .main { flex: 1; min-height: 0; }
  #stash { display: none; }
  .plainlayout { display: flex; flex-direction: column; height: 100%; overflow: auto; }
  .plainlayout .mapwrap { min-height: 60vh; }
  .dv-dockview { height: 100%; }
  /* dockview is wired to the planner's tokens via its CSS variables,
     so tabs and separators don't fall out of the color scheme. The theme class sits
     on a child of #dock — so it has to be named here too, otherwise
     its gray wins (that was the dark veil while dragging). */
  #dock, #dock .dockview-theme-dark, #dock .dockview-theme-light {
    --dv-background-color: var(--ground);
    --dv-group-view-background-color: var(--panel);
    --dv-tabs-and-actions-container-background-color: var(--panel-2);
    --dv-tabs-and-actions-container-height: 32px;
    --dv-tabs-and-actions-container-font-size: 12px;
    --dv-activegroup-visiblepanel-tab-background-color: var(--panel);
    --dv-activegroup-hiddenpanel-tab-background-color: var(--panel-2);
    --dv-inactivegroup-visiblepanel-tab-background-color: var(--panel);
    --dv-inactivegroup-hiddenpanel-tab-background-color: var(--panel-2);
    --dv-activegroup-visiblepanel-tab-color: var(--ink);
    --dv-activegroup-hiddenpanel-tab-color: var(--ink-3);
    --dv-inactivegroup-visiblepanel-tab-color: var(--ink-2);
    --dv-inactivegroup-hiddenpanel-tab-color: var(--ink-3);
    --dv-tab-divider-color: var(--line);
    --dv-separator-border: var(--line);
    --dv-active-sash-color: var(--accent);
    --dv-drag-over-background-color: var(--accent-soft);
    --dv-drag-over-border-color: var(--accent);
    --dv-icon-hover-background-color: var(--line);
    --dv-paneview-active-outline-color: var(--accent);
    --dv-floating-box-shadow: var(--shadow);
    --dv-floating-border: 1px solid var(--line-2);
    --dv-floating-group-border: 1px solid var(--line-2);
    --dv-floating-titlebar-background-color: var(--panel-2);
    --dv-sash-color: transparent;
    --dv-edge-dock-indicator-color: var(--accent);
    --dv-tabs-container-scrollbar-color: var(--line-2);
    --dv-paneview-header-border-color: var(--line);
  }
  /* No grab cursor between the map buttons — it flickers on hover. */
  .zoom, .palette, .mapui-tl, .mapui-br, .layerrow { cursor: default; }
  .zoom button, .palette button, .layerrow button { cursor: pointer; }
  #dock .dv-tab {
    font-family: var(--sans); font-weight: 500;
    padding: 0 12px;                      /* otherwise the tab text stuck to the left edge */
    border-right: 1px solid var(--line);
  }
  #dock .dv-groupview.dv-active-group > .dv-tabs-and-actions-container { border-bottom: 2px solid var(--accent); }
  #dock .dv-groupview.dv-inactive-group > .dv-tabs-and-actions-container { border-bottom: 2px solid var(--line); }
  /* One column top left: search, layers below it. Both used to be
     positioned absolutely on their own — hence the gap between them. */
  .mapui-tl {
    position: absolute; top: 10px; left: 10px; z-index: 3;
    display: flex; flex-direction: column; gap: 6px; align-items: stretch;
    width: min(260px, calc(100% - 64px));
  }
  .geo { position: relative; }
  .geo input {
    width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); box-shadow: var(--shadow); font-size: 12px; color: var(--ink);
  }
  .geolist {
    position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); overflow: hidden; max-height: 240px; overflow-y: auto;
  }
  .geolist button { display: block; width: 100%; text-align: left; padding: 6px 10px; font-size: 12px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); }
  .geolist button:hover { background: var(--panel-2); }
  .geolist .cred { padding: 4px 10px; font-size: 10px; color: var(--ink-3); font-family: var(--mono); }
  /* Bottom right in one row: source, then scale — same edge, same height. */
  .mapui-br { position: absolute; right: 12px; bottom: 12px; z-index: 2; display: flex; align-items: stretch; gap: 6px; }
  .attrib {
    display: flex; align-items: center;
    font-family: var(--mono); font-size: 10px; color: var(--ink-2);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
  }
  /* Fixed height = panel height. Without it the SVG takes its height from its viewBox
     (width × aspect ratio), grows past the panel, and the palette, scale,
     and hint sit invisibly beneath it — and clientHeight lies when centering. */
  .mapwrap { position: relative; height: 100%; min-height: 0; overflow: hidden; background: #d8d5cc; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* --sw: factor for strokes that measure in screen points (non-scaling-stroke).
     1 on the map; the export renders at double size and scales it up, otherwise
     the conduits would come out half as thick in the image as on screen. */
  /* --look-*: the appearance controls (gear icon). They hang off the SVG, not :root,
     and therefore travel along with the clone in image export and the print sheet. Appearance always
     runs through these factors — never through a fresh render pass. */
  svg.map { position: absolute; inset: 0; --sw: 1; --look-font: 1; --look-alpha: 1; --look-line: 1; }
  /* Field-of-view cones, AP rings, and IR areas all live in #g-cover: one factor for all,
     so overlaps don't come out doubly dark. */
  #g-cover { opacity: var(--look-alpha); }
  .map text, .map image { -webkit-user-select: none; user-select: none; }
  /* Display filters: classes on the SVG so image export and print show the same as the map. */
  .map.hide-cones .cone { display: none; }
  .map.hide-rings .apcover { display: none; }
  .map.hide-conds #g-conduits, .map.hide-conds #g-labels, .map.hide-conds #g-sections { display: none; }
  .map.hide-labels #g-labels { display: none; }
  /* Cross-sections have their own toggle: they sit in their own group and
     stay on when labels are switched off. */
  .map.hide-sections #g-sections { display: none; }
  /* Tiles fade in; the old zoom level stays underneath until then. */
  #g-tiles image, #g-overlay image { opacity: 0; transition: opacity 0.25s ease-out; }
  #g-tiles image.ok, #g-overlay image.ok { opacity: 1; }
  #g-tiles image.instant { transition: none; }
  .mapwrap.mode-place, .mapwrap.mode-draw { cursor: crosshair; }
  .mapwrap.mode-select { cursor: grab; }
  .mapwrap.mode-select.panning { cursor: grabbing; }
  svg.map { width: 100%; height: 100%; display: block; }
  /* Tool palette bottom left on the map: icons, with names on request. */
  .palette {
    position: absolute; left: 12px; bottom: 12px; z-index: 3; display: flex; flex-direction: column; gap: 4px;
    padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
  }
  .ptool {
    position: relative; display: flex; align-items: center; gap: 8px; height: 34px; min-width: 34px; padding: 0 8px;
    border: 1px solid transparent; border-radius: 6px; background: none; color: var(--ink); font-size: 13px; font-weight: 500; text-align: left;
  }
  .ptool .lbl { display: none; white-space: nowrap; padding-right: 10px; }
  .palette.labels .ptool .lbl { display: inline; }
  .ptool .k { position: absolute; right: 2px; bottom: 1px; font-family: var(--mono); font-size: 9px; line-height: 1; color: var(--ink-3); }
  .ptool:hover { background: var(--panel-2); border-color: var(--line-2); }
  .ptool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .ptool[aria-pressed="true"] .k { color: var(--accent); }
  .ptool.finish { color: var(--ap); }
  .ptool.tog { height: 22px; justify-content: center; padding: 0; color: var(--ink-3); border-top: 1px solid var(--line); border-radius: 0; margin-top: 2px; }
  .ptool.tog:hover { background: none; border-color: var(--line); color: var(--ink); }
  .palette.labels .ptool.tog svg { transform: scaleX(-1); }
  .zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
  .layermenu { position: relative; }
  .layermenu > button[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  /* Layer menu: a row of identical buttons that unfolds to the left of the layers
     button, at its height. No box, no text — title and aria-label are enough. */
  .layerrow {
    position: absolute; right: calc(100% + 4px); top: 0; display: flex; flex-direction: column; gap: 4px;
    opacity: 0; visibility: hidden; transform: translateX(8px); transition: opacity .18s ease-out, transform .18s ease-out, visibility 0s linear .18s;
  }
  .layermenu.open .layerrow { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  /* Appearance: unlike the layer row, a box with rows — sliders need room. */
  .lookpanel {
    position: absolute; right: calc(100% + 6px); top: 0; width: 252px; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px;
    opacity: 0; visibility: hidden; transform: translateX(8px); transition: opacity .18s ease-out, transform .18s ease-out, visibility 0s linear .18s;
  }
  .layermenu.open .lookpanel { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .lookrow { display: grid; grid-template-columns: 1fr 76px 34px; align-items: center; gap: 6px; margin-bottom: 7px; font-size: 11.5px; color: var(--ink-2); }
  .lookrow label { cursor: pointer; min-width: 0; }
  .lookrow input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
  .lookrow .val { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; white-space: nowrap; }
  .lookrow.wide { display: flex; gap: 7px; margin: 10px 0 8px; font-size: 12px; color: var(--ink); }
  .lookend { display: flex; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 7px; }
  /* `.zoom button` turns every button here into a 32×32 icon — the reset button
     is one with text and has to claim that back. */
  .zoom .lookend .btn {
    width: auto; height: auto; display: inline-block; box-shadow: none;
    padding: 4px 9px; font-size: 11px; color: var(--ink-2); background: var(--panel-2);
  }
  .zoom .lookend .btn:hover { color: var(--ink); border-color: var(--ink-3); }
  /* Selected = filled, otherwise a normal button. Nothing translucent. */
  .zoom .layerrow button[aria-checked="true"], .zoom .layerrow button[aria-pressed="true"] { border-color: var(--accent); color: #fff; background: var(--accent); }
  .zoom .layerrow button:disabled { color: var(--ink-3); opacity: 1; }
  .zoom button {
    width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line-2); box-sizing: border-box;
    display: grid; place-items: center; padding: 0; line-height: 1;
    background: var(--panel); color: var(--ink); font-size: 16px; box-shadow: var(--shadow);
  }
  .zoom button { transition: color .15s, border-color .15s, background .15s; }
  .zoom button:hover:not(:disabled):not([aria-checked="true"]):not([aria-pressed="true"]) { color: var(--accent); border-color: var(--accent); }
  .zoom button:active:not(:disabled) { background: var(--accent-soft); }
  .ptool { transition: color .15s, border-color .15s, background .15s; }
  .palette .ptool:hover:not([aria-pressed="true"]) { color: var(--accent); }
  /* Fixed width: only the bar inside it grows, the box stays put. */
  .scalebar {
    width: 158px; box-sizing: border-box; font-family: var(--mono); font-size: 11px; line-height: 1.2;
    color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
  }
  .scalebar i { display: block; height: 2px; background: var(--ink); margin-top: 3px; }

  /* SVG element styles */
  .cone { fill: var(--cam-soft); stroke: none; pointer-events: none; }
  .apcircle { pointer-events: none; }
  .apcircle.far { fill: var(--ap-soft); stroke: var(--ap); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .apcircle.near { fill: var(--ap-soft); stroke: var(--ap); stroke-width: 0.6; stroke-opacity: 0.45; }
  .marker { cursor: pointer; }
  /* Hover in the list highlights the map node and vice versa — thinner than "selected". */
  .marker.hover .body { stroke: var(--sel); stroke-width: 3; }
  .marker circle.body { stroke: #fff; stroke-width: 2.5; }
  .marker.cam circle.body { fill: var(--cam); }
  .marker.ap circle.body { fill: var(--ap); }
  .marker.hub circle.body { fill: var(--hub); }
  .marker.sw circle.body { fill: var(--accent); }
  .marker text { fill: #fff; font-family: var(--mono); font-size: calc(11px * var(--look-font)); font-weight: 500; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .marker rect.body { stroke: #fff; stroke-width: 2.5; }
  .marker.jb rect.body { fill: var(--jb); }
  .marker.jb.active rect.body { fill: var(--accent); }
  .marker.selected circle.body, .marker.selected rect.body { stroke: var(--sel); stroke-width: 3.5; }
  .marker .bond { fill: none; stroke: var(--jb); stroke-width: 1.5; opacity: 0.5; pointer-events: none; }
  /* Connection status: red = missing or wrong, yellow = warning. The white ring
     underneath keeps it visible on dark aerial imagery too. */
  .marker circle.alerthalo { fill: none; stroke: #fff; stroke-width: 3.5; opacity: 0.5; pointer-events: none; }
  .marker circle.alert { fill: none; stroke: var(--cam); stroke-width: 2; stroke-dasharray: 3 3; pointer-events: none; }
  .marker circle.alert.warn { stroke: var(--warn); }
  .marker .dir { stroke: #fff; stroke-width: 2; pointer-events: none; }
  .marker .rotring { fill: none; stroke: var(--sel); stroke-width: 1.5; opacity: 0.4; stroke-dasharray: 3 4; pointer-events: none; }
  .marker .rothandle { fill: #fff; stroke: var(--sel); stroke-width: 2.5; pointer-events: none; }
  .marker .rothit { fill: transparent; cursor: grab; }
  .mapwrap.rotating .marker .rothit { cursor: grabbing; }
  /* Conduit strokes measure in screen points: they stay visible when zooming out,
     and don't turn into bands when zooming in. That's why the width is in px. */
  .conduit path, .draft path { vector-effect: non-scaling-stroke; }
  /* The core is now just the hit area: what's visible is the trench, ducts, and cables. */
  .conduit path.core { fill: none; stroke: transparent; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; }
  .conduit path.halo { fill: none; stroke: #fff; stroke-width: calc(9px * var(--sw)); stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
  .conduit.selected path.halo { stroke: var(--sel); opacity: 0.9; }
  .conduit.hover path.halo { stroke: var(--sel); opacity: 0.6; }
  .vtx { fill: #fff; stroke-width: 2; cursor: move; }
  /* Three layers on the same path: the trench as a wide, pale base, then a light
     parallel per duct, then a colored strand per cable inside it. The parallels are
     true offset polylines (offsetPath) — only that way does the stroke not just grow thicker. */
  .conduit path.trench { fill: none; stroke: var(--ink); stroke-opacity: 0.12; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  /* Duct lines dark, not light: they sit on the white backing of the conduit,
     white on white would be invisible. Where a cable lies in the duct, its
     strand covers the line — that's intentional. */
  .conduit path.duct { fill: none; stroke: var(--ink-3); stroke-opacity: 0.55; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .conduit path.strand { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  /* Cross-section along the route: one circle per duct, with the cables as dots inside.
     Lives in #g-sections, so above the markers and below the handles. */
  .csection { cursor: pointer; }
  .csection circle.duct { fill: var(--panel); stroke: var(--ink-3); stroke-width: 1.2; }
  .csection circle.cable { stroke: var(--ink-3); stroke-width: 0.5; }
  .csection text { font-family: var(--mono); font-size: calc(9px * var(--look-font)); font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  /* Cluster on zoom-out: a circle, the count of elements, an outer ring
     made of one color segment per kind it contains. Pure display, no state. */
  .marker.cluster circle.body { fill: var(--cluster); stroke: #fff; stroke-width: 2.5; }
  .marker.cluster text { font-size: calc(12px * var(--look-font)); font-weight: 700; }
  /* Butt instead of round: otherwise the caps fill the gap between two segments again. */
  .marker.cluster .ring { fill: none; stroke-width: 3; stroke-linecap: butt; }
  .marker.cluster .ring.cam { stroke: var(--cam); }
  .marker.cluster .ring.ap { stroke: var(--ap); }
  .marker.cluster .ring.jb { stroke: var(--jb); }
  .marker.cluster .ring.hub { stroke: var(--hub); }
  .pname {

  }

  }

  .btn.info { flex: 0 0 auto; width: 34px; padding: 0; display: grid; place-items: center; color: var(--ink-2); }

  .modal {
    max-width: 520px; width: calc(100% - 32px); border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink); padding: 18px 20px 14px; box-shadow: var(--shadow);
  }

  .modal p { margin: 0 0 10px; font-size: 13px; line-height: 1.55; }
  /* Export: one table — icon, title, and short text on the left, only icon buttons on the right. */
  .exp { display: grid; grid-template-columns: 1fr auto; }

  .exprow .lead, .exprow .row { padding: 10px 0; border-top: 1px solid var(--line); }

  .modal .selhead .btn.icon:hover { color: var(--ink); background: var(--panel-2); }
  /* Two states, one pill switch: filled = selected. */
  .pill { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; background: var(--panel-2); }
  .pill button { border: 0; background: none; padding: 4px 12px; font-size: 12px; color: var(--ink-2); border-radius: 0; }
  .pill button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  /* Toggle switch instead of a checkbox. */
  .sw { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .sw input { position: absolute; opacity: 0; width: 0; height: 0; }
  .sw i { position: relative; width: 30px; height: 18px; border-radius: 999px; background: var(--line-2); transition: background .15s; flex: 0 0 auto; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .sw input:checked + i { background: var(--accent); }
  .sw input:checked + i::after { transform: translateX(12px); }
  .sw input:focus-visible + i { outline: 2px solid var(--accent-soft); }
  .exprow .opts label { display: inline-flex; align-items: center; gap: 4px; }
  .exprow .row { margin: 0; flex: 0 0 auto; }
  .modal h3 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
  .modal ul { margin: 0 0 10px; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  .modal li { margin-bottom: 5px; }
  .modal li b { color: var(--ink); }
  .spec.help dt { font-family: var(--mono); color: var(--ink-3); }
  .spec.help dd { line-height: 1.45; }
  kbd {
    font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-2);
    border-radius: 4px; padding: 1px 5px; background: var(--panel-2); color: var(--ink-2);
  }
  .modal a { color: var(--accent); }
  .modal p.tip { border-left: 2px solid var(--accent); padding-left: 10px; color: var(--ink-2); }
  .imgmodal { max-width: min(1200px, calc(100vw - 24px)); width: calc(100vw - 24px); }

  /* Flex, not grid: with grid the track gets set to the image width (1500 px),
     and max-width: 100% then refers to the track instead of the frame —
     the image would never fit the available width that way. */
  .imgwrap {
    height: min(82vh, 860px); overflow: auto; background: #fff; border: 1px solid var(--line);
    border-radius: 8px; display: flex; padding: 8px; cursor: grab; touch-action: none;
  }

    object-fit: contain; flex: 0 0 auto; user-select: none; -webkit-user-drag: none;
    pointer-events: none;   /* all pointer events belong to the frame, not the image */
  }
  .segs {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .seg {
    display: inline-flex; align-items: center; gap: 7px;

  }

  .note.tip { border-left: 2px solid var(--accent); padding-left: 8px; }

  .subhead { margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .cabs { display: grid; gap: 6px; }
  .cabrow { display: grid; grid-template-columns: 10px 1fr 68px 32px 32px; gap: 8px; align-items: stretch; }
  /* Device rows additionally carry the unit price, small and in digit width. */

  /* Heading per duct: name on the left, trash can on the right and understated — it discards

  .subhead.ducthead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ducthead .ico { width: 28px; height: 24px; padding: 0; display: grid; place-items: center; color: var(--ink-3); }

  .cabrow .p { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--ink-3); align-self: center; white-space: nowrap; }

  /* Same height as the number field next to it, hence stretch instead of a fixed height. */

  .cabrow .del:hover { color: var(--cam); border-color: var(--cam); }

  /* The button belongs next to the select, not below it. */

  .addcab select { flex: 1 1 0; min-width: 0; width: auto; }
  .addcab .btn { flex: 0 0 auto; padding: 0; width: 34px; align-self: stretch; display: grid; place-items: center; color: var(--ink-2); }
  .addcab .btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .addcab .btn svg { width: 15px; height: 15px; }
  .clabels text { font-family: var(--mono); font-size: calc(10px * var(--look-font)); font-weight: 500; fill: #000; paint-order: stroke; stroke: #fff; stroke-width: 2.5; stroke-linejoin: round; pointer-events: none; }
  .draft path { fill: none; stroke: var(--accent); stroke-width: calc(3px * var(--sw) * var(--look-line)); stroke-dasharray: 6 5; }
  .draft circle { fill: #fff; stroke: var(--accent); stroke-width: 2; }

  /* Sidebar */
  .pane { height: 100%; overflow-y: auto; padding: 14px 16px 24px; background: var(--panel); }   /* each panel scrolls on its own */
  .pane h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 18px 0 8px; font-weight: 600; }
  .pane h2:first-child { margin-top: 0; }

  .searchrow { margin: 0 0 10px; display: flex; gap: 6px; align-items: stretch; }

    flex: 0 0 auto; max-width: 40%; padding: 0 8px; border-radius: 6px;
    border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink); font-size: 12px;
  }

    flex: 1 1 0; min-width: 0; padding: 7px 10px; border-radius: 6px;

    height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; line-height: 1;
    padding: 0 9px; border-radius: 999px; font-size: 12px;

  }

  .selhead { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }

  .btn.icon { width: 32px; height: 30px; padding: 0; display: grid; place-items: center; color: var(--ink-2); }
  .btn.icon:hover { color: var(--ink); border-color: var(--ink-3); }
  .btn.icon.danger:hover { color: var(--cam); border-color: var(--cam); }
  /* Wide: image on the left, links on the right. Narrow: image on top, links below. */

    display: block; width: 100%; height: 190px; object-fit: contain;

  }

  /* One row under the image: product page on the left, retailer search on the right. */

    border: 1px solid var(--line-2); border-radius: 6px; padding: 0 9px; height: 28px; box-sizing: border-box; line-height: 1;
  }

  /* Magnifier and retailer choice as one button: search on the left, switch on the right. */
  .shopsel { margin-left: auto; display: inline-flex; align-items: stretch; }
  .shopsel .go {
    display: inline-flex; align-items: center; color: var(--ink-2); text-decoration: none; height: 28px; box-sizing: border-box; line-height: 1;
    border: 1px solid var(--line-2); border-right: 0; border-radius: 6px 0 0 6px; padding: 0 8px;

  .shopsel .pick {
    font-size: 11px; color: var(--ink-2); background: var(--panel-2); height: 28px; box-sizing: border-box;
    border: 1px solid var(--line-2); border-radius: 0 6px 6px 0; padding: 0 6px;
  }
  .cat { display: flex; flex-direction: column; gap: 6px; }
  .item {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start;

  .tag { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); }
  .tag.w { color: var(--warn); border-color: var(--warn); }

  .itemrow .iteminfo:hover { border-color: var(--line-2); background: var(--panel); }
  /* Hover card: one node on the document, no state. Short version with an image and

  .field { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; margin: 6px 0; }
  .field label { font-size: 12px; color: var(--ink-2); }
  .field input[type="text"], .field input[type="number"], .field select, .field textarea {
    width: 100%; padding: 6px 8px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--panel-2);
  }

  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

    else if (e.key === "a" || e.key === "A") setMode("place-ap");
    else if (e.key === "j" || e.key === "J") setMode("place-jb");

  // Selection no longer switches the tab — properties live in the ribbon above.

  // ---------- Layout: dockview ----------

  // The layout itself is part of the saved state.
  const DOCK_NODES = { map: "mapwrap", sel: "pane-sel", build: "pane-build", list: "pane-list", cost: "pane-cost" };
  Object.values(DOCK_NODES).forEach(id => { const n = document.getElementById(id); if (n) DETACHED.push(n); });

  };
  function recordDockSizes() {
    if (!dock) return;

    for (const pl of dock.panels) { const sz = groupSize(pl.group); if (sz) out[pl.id] = sz; }

    dock.addPanel({ id: "sel", component: "sel", title: t(DOCK_TITLE.sel), position: { referencePanel: "build", direction: "above" } });
    dock.addPanel({ id: "list", component: "list", title: t(DOCK_TITLE.list), position: { referencePanel: "build", direction: "within" } });
    dock.addPanel({ id: "cost", component: "cost", title: t(DOCK_TITLE.cost), position: { referencePanel: "build", direction: "within" } });
    const b2 = dock.getPanel("build");
    if (b2) {

      try { b2.api.setSize({ width: 360 }); } catch (e) {}

  function fallbackLayout(host) {

    host.classList.add("plainlayout");

  }
  // The bundle loads as its own <script>. If it's not there yet, we wait
  // for its load event — but not forever: if the file is missing, the stack kicks in.
  let layoutDone = false;

  function initLayout() {

    // #dock, and hand it to dockview below before the first panel goes in. Only wait

  function buildViewMenu() {

  // Properties in a fixed order, rating as color AND symbol

        + `<span class="mk">${mk(g.over ? "warn" : "ok")}</span>${esc(t("link.poe.v", { used: fmtW(g.watts), budget: g.poe }))}</dd>`);
      rows.push(`<dt>${esc(t("link.ports"))}</dt><dd class="${g.portsOver ? "warn" : "ok"}">`

      rows.push(`<dt>${esc(t("link.devices"))}</dt><dd class="${g.devices.length ? "" : "none"}">`
        + (g.devices.length ? g.devices.map(d => goLink("item", d.id, `${d.label} · ${d.kind === "jb" ? (gearNames(d) || tx(modelOf(d).name)) : tx(modelOf(d).name)}`)).join("") : esc(t("link.none.dev"))) + `</dd>`);

  const previewModel = (pv) => pv && (pv.kind === "cond" ? CONDUITS[pv.key] : (CATALOG[pv.kind] || {})[pv.key]);

  function mainsAdvice(it, L) {

    root.appendChild(h(`
      <div class="selhead"><h2 id="f-chead"></h2><div class="hacts"><button class="btn icon" id="f-cinfo" title="${esc(t("info.title"))}" aria-label="${esc(t("info.title"))}">${INFO}</button><button class="btn icon danger" id="f-cdel" title="${esc(t("f.del"))}" aria-label="${esc(t("f.del"))}">${TRASH}</button></div></div>
      <div class="field"><label for="f-kind">${esc(t("f.kind"))}</label><select id="f-kind"><option value="trench">${esc(t("f.kind.trench"))}</option><option value="cable">${esc(t("f.kind.cable"))}</option></select></div>
      <div id="f-ducts"></div>
      ${solo ? "" : `<div class="row"><button class="btn" id="f-duct-add">${esc(t("f.duct.add"))}</button></div>`}
      <div class="field"><label for="f-clabel">${esc(t("f.clabel"))}</label><input type="text" id="f-clabel" value="${esc(c.label)}"></div>
      <dl class="spec" id="f-cstats"></dl>
      <p class="note">${esc(t("hint.vtx"))}</p>
      <p class="note">${esc(t("cond.nosplit"))}</p>`));

    const box = $("f-ducts");
    condDucts(c).forEach((duct, di) => {
      const used = new Set(ductCables(duct).map(x => x.type));
      const free = Object.keys(CABLES).filter(k => !used.has(k));
      const head = solo ? esc(t("f.cabs")) : `${esc(t("f.duct.n", { n: di + 1 }))}`;
      const bin = solo || condDucts(c).length < 2 ? "" :
        `<button class="btn ico" id="f-ductx-${di}" title="${esc(t("f.duct.del"))}" aria-label="${esc(t("f.duct.del"))}">${TRASH}</button>`;
      const blk = h(`<div class="duct">
        <h3 class="subhead ducthead">${head}${bin}</h3>
        ${solo ? "" : `<div class="field"><label for="f-duct-pipe-${di}">${esc(t("f.pipe"))}</label><select id="f-duct-pipe-${di}">${Object.keys(PIPES).map(k => `<option value="${k}">${esc(tx(PIPES[k].name))} · ${PIPES[k].m.toFixed(2)} €/m</option>`).join("")}</select></div>`}
        <div class="cabs" id="f-cabs-${di}"></div>
        ${free.length ? `<div class="field"><label for="f-cab-new-${di}">${esc(t("f.cab.add"))}</label><div class="addcab"><select id="f-cab-new-${di}">${free.map(k => `<option value="${k}">${esc(optText("cable", k, CABLES[k]))}</option>`).join("")}</select><button class="btn icon" id="f-cabi-new-${di}" title="${esc(t("info.title"))}" aria-label="${esc(t("info.title"))}">${INFO}</button><button class="btn add" id="f-cab-go-${di}" title="${esc(t("f.cab.add"))}" aria-label="${esc(t("f.cab.add"))}">${PLUS}</button></div></div>` : ""}
      </div>`).firstElementChild;
      box.appendChild(blk);
      // Each duct has its own type and therefore its own price.
      if (!solo) blk.querySelector("#f-duct-pipe-" + di).onchange = (e) => condEdit(c, () => { duct.pipe = PIPES[e.target.value] ? e.target.value : "dn50"; });
      const cabs = blk.querySelector("#f-cabs-" + di);
      const list = ductCables(duct);
      if (!list.length) cabs.appendChild(h(`<div class="empty">${esc(t(solo ? "f.cabs.none.bare" : "f.cabs.none"))}</div>`).firstElementChild);
      list.forEach((x, i) => {
        const d = CABLES[x.type];
        const r = h(`<div class="cabrow" data-hover="cable:${esc(x.type)}"><span class="dot" style="background:${d.color}"></span><span class="n">${esc(tx(d.name))}</span><input class="qty" type="number" min="1" max="12" id="f-cab-${di}-${i}" value="${x.n}"><button class="btn ico" id="f-cabi-${di}-${i}" title="${esc(t("info.title"))}" aria-label="${esc(t("info.title"))}">${INFO}</button><button class="btn del" id="f-cabx-${di}-${i}" title="${esc(t("f.cab.del"))}" aria-label="${esc(t("f.cab.del"))}">${TRASH}</button></div>`).firstElementChild;
        cabs.appendChild(r);
        r.querySelector(`#f-cab-${di}-${i}`).onchange = (e) => condEdit(c, () => { x.n = Math.max(1, +e.target.value | 0); });
        r.querySelector(`#f-cabx-${di}-${i}`).onclick = () => condEdit(c, () => { duct.cables.splice(duct.cables.indexOf(x), 1); });
        r.querySelector(`#f-cabi-${di}-${i}`).onclick = () => showProductInfo("cable", x.type);
      });
      if (free.length) {
        blk.querySelector("#f-cab-go-" + di).onclick = () => condEdit(c, () => {
          duct.cables = duct.cables || []; duct.cables.push({ type: $("f-cab-new-" + di).value, n: 1 });
        });
        blk.querySelector("#f-cabi-new-" + di).onclick = () => showProductInfo("cable", $("f-cab-new-" + di).value);
        hoverSel(blk.querySelector("#f-cab-new-" + di), "cable");
      }
      // Removing a duct takes its cables with it — nothing gets reassigned.
      if (bin) blk.querySelector("#f-ductx-" + di).onclick = () => condEdit(c, () => { c.ducts.splice(di, 1); });
    });
    if (!solo) $("f-duct-add").onclick = () => condEdit(c, () => { if (c.ducts.length < 6) c.ducts.push({ pipe: "dn50", cables: [] }); });
    $("f-cinfo").onclick = () => showInfo(CAT_TABS.find(x => x.id === "cond"));
    // Switching type: to cable run collapses all cables into one bundle, back to trench
    // wraps a DN 50 duct around it. Both go through migrateConduit — the same rule
    // as on load, so a cable run never carries more than one duct.
    $("f-kind").onchange = (e) => condEdit(c, () => { c.kind = e.target.value === "cable" ? "cable" : "trench"; migrateConduit(c); });
    $("f-clabel").onchange = (e) => { c.label = e.target.value; changed(); };
    $("f-cdel").onclick = deleteSelected;
  }

  // ---------- Build: catalog with search and filter badges ----------
  function matchesQuery(m, key, q) {
    if (!q) return true;
    // Both language variants for indoor/outdoor, so "outdoor" also matches in the German
    // UI (and vice versa).
    const side = m.out === undefined ? "" : (m.out ? "außen aussen outdoor" : "innen indoor");
    const hay = [tx(m.name), key, VENDORS[vendorOf(m)], m.res, tx(m.poe), m.ip, m.wifi, tx(m.mount), tx(m.sub), tx(m.note), side, (tx(m.tags) || []).join(" ")]
      .filter(Boolean).join(" ").toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
  }
  // Only filter the badges of the active tab — the ids are unique.
  function matchesFacets(m, set) {
    for (const f of set) if (catFacets.has(f.id) && !f.test(m)) return false;
    return true;
  }
  // Card plus ⓘ top right: shows the datasheet without adding anything.
  // Sibling of the card, layered over it via CSS — a button inside a button would be
  // invalid HTML, and this way the click never hits the place/add path.
  function catCard(card, kind, key, onInfo) {
    const row = h(`<div class="itemrow" data-hover="${kind}:${esc(key)}"></div>`).firstElementChild;
    row.appendChild(card);
    const i = h(`<button class="btn icon iteminfo" title="${esc(t("info.title"))}" aria-label="${esc(t("info.title"))}">${INFO}</button>`).firstElementChild;
    i.onclick = (e) => { e.stopPropagation(); (onInfo || (() => showProductInfo(kind, key)))(); };
    row.appendChild(i);
    return row;
  }
  function catButton(kind, key, m, extra) {
    return h(`<button class="item" data-kind="${kind}" data-key="${esc(key)}">
      <span class="n">${esc(tx(m.name))}</span><span class="p">${m.price} €</span>
      <span class="d">${esc(extra)}</span>
      ${m.tags ? `<span class="tags">${(tx(m.tags) || []).map(x => `<span class="tag ${/kein PoE|no PoE|WLAN|Wi-Fi|Strom nötig|needs power|Erdarbeit|earthwork|nicht mehr zugänglich|not reachable|keine Glasfaser|no fibre|Fachbetrieb|specialist|kein NVR|no NVR/.test(x) ? "w" : ""}">${esc(x)}</span>`).join("")}</span>` : ""}
    </button>`).firstElementChild;
  }
  // Which button looks pressed depends only on the mode — the list doesn't
  // need to be rebuilt for that. That's exactly what broke the scroll position.
  function syncPressed(root) {
    const cur = { cam: mode === "place-cam" && placeModel, ap: mode === "place-ap" && placeAp, jb: mode === "place-jb" && placeJb, cond: mode === "draw" && drawType };
    // The hub has no place mode; a permanently wrong
    // aria-pressed turned the button into a switch that never turns on.
    root.querySelectorAll("[data-kind][data-key]").forEach(b => {
      if (b.dataset.kind === "gear") return;
      b.setAttribute("aria-pressed", String(cur[b.dataset.kind] === b.dataset.key));
    });
  }
  const catSig = () => `${lang}|${catTab}|${catQuery[catTab] || ""}|${[...catFacets].sort().join(",")}`;
  function fillList(id, sig, keys, make) {
    const box = $(id); if (!box) return;
    if (box.dataset.sig === sig) return;
    box.dataset.sig = sig; box.innerHTML = "";
    if (!keys.length) { box.appendChild(h(`<div class="empty">${esc(t("cat.none"))}</div>`).firstElementChild); return; }
    keys.forEach(k => box.appendChild(make(k)));
  }
  function fillCams() {
    const q = catQuery.cam, set = FACETS_AP && FACETS;
    fillList("cat-cams", catSig(), Object.keys(CAMS).filter(k => matchesQuery(CAMS[k], k, q) && matchesFacets(CAMS[k], set)), (k) => {
      const m = CAMS[k];
      const b = catButton("cam", k, m, `${m.res} · ${m.fov >= 360 ? "PTZ" : m.fov + "°"} · IR ${m.ir} m · ${t(m.out ? "spec.outdoor" : "spec.indoor")}`);
      b.onclick = () => { placeModel = k; preview = { kind: "cam", key: k }; setMode("place-cam"); };
      return catCard(b, "cam", k);
    });
  }
  function fillAps() {
    const q = catQuery.ap;
    fillList("cat-aps", catSig(), Object.keys(APS).filter(k => matchesQuery(APS[k], k, q) && matchesFacets(APS[k], FACETS_AP)), (k) => {
      const a = APS[k];
      const b = catButton("ap", k, a, `${a.wifi} · ~${a.radius} m · ${t(a.out ? "spec.outdoor" : "spec.indoor")}`);
      b.onclick = () => { placeAp = k; preview = { kind: "ap", key: k }; setMode("place-ap"); };
      return catCard(b, "ap", k);
    });
  }
  // A device belongs at a point. If one is selected, it moves there; otherwise
  // it gets placed and brings its own point along.
  function addGear(it, key) {
    it.gear = it.gear || [];
    const e = it.gear.find(g => g.model === key);
    if (e) e.n++; else it.gear.push({ model: key, n: 1 });
    changed();
    setStatus(t("jb.gear.added", { name: tx(JUNCTIONS[key].name), label: it.label }));
  }
  function clickJb(k) {
    const it = sel && sel.kind === "item" ? state.items.find(i => i.id === sel.id) : null;
    if (isDevice(k) && it && (it.kind === "jb" || it.kind === "hub")) return addGear(it, k);
    placeJb = k; preview = { kind: "jb", key: k }; setMode("place-jb");
  }
  // Two groups in one list: first the locations, then what goes into them.
  // The subheadings travel through fillList() as pseudo-keys.
  function fillJbs() {
    const q = catQuery.jb;
    const hit = Object.keys(JUNCTIONS).filter(k => matchesQuery(JUNCTIONS[k], k, q) && matchesFacets(JUNCTIONS[k], FACETS_JB));
    const hous = hit.filter(isHousing), dev = hit.filter(isDevice);
    const keys = [].concat(hous.length ? ["#housing"] : [], hous, dev.length ? ["#gear"] : [], dev);
    fillList("cat-jbs", catSig(), keys, (k) => {
      if (k[0] === "#") return h(`<h3 class="subhead">${esc(t("cat.jb." + k.slice(1)))}</h3>`).firstElementChild;
      const j = JUNCTIONS[k];
      const b = catButton("jb", k, j, tx(j.use));
      b.onclick = () => clickJb(k);
      return catCard(b, "jb", k);
    });
  }
  // Hub and accessories: no place mode. A click increments the count by one
  // and puts the item in the selection panel.
  function fillGear() {
    const q = catQuery.gear;
    const vis = INFRA.filter(i => !i.hidden);
    fillList("cat-gear", catSig(), vis.filter(i => matchesQuery(i, i.id, q) && matchesFacets(i, FACETS_GEAR)).map(i => i.id), (k) => {
      const m = vis.find(i => i.id === k);
      const b = catButton("gear", k, m, tx(m.sub));
      b.onclick = () => {
        const cur = state.infra[k] || { on: false, qty: 1 };
        state.infra[k] = { on: true, qty: (cur.on ? (cur.qty || 0) : 0) + 1 };
        select({ kind: "infra", id: k }); changed();
      };
      return catCard(b, "gear", k);
    });
  }
  // Two groups: trenches with ducts, then cable runs without a duct. The sub-
  // headings travel through fillList() as pseudo-keys, as with the junctions.
  function fillConds() {
    const q = catQuery.cond;
    const hit = Object.keys(CONDUITS).filter(k => matchesQuery(CONDUITS[k], k, q));
    const tr = hit.filter(k => !isCableRun(CONDUITS[k])), cb = hit.filter(k => isCableRun(CONDUITS[k]));
    const keys = [].concat(tr.length ? ["#trench"] : [], tr, cb.length ? ["#cable"] : [], cb);
    fillList("cat-cond", catSig(), keys, (k) => {
      if (k[0] === "#") return h(`<h3 class="subhead">${esc(t("cat." + k.slice(1)))}</h3>`).firstElementChild;
      const ct = CONDUITS[k];
      const cabs = condCables(ct), perM = pipeRate(ct) + cabs.reduce((a, x) => a + CABLES[x.type].m * x.n, 0);
      const lead = cabs[0] && CABLES[cabs[0].type];
      const b = h(`<button class="item" data-kind="cond" data-key="${k}"><span class="n">${esc(tx(ct.name))}</span><span class="p">${perM.toFixed(2)} €/m</span><span class="d">${esc(lead ? tx(lead.note) : t("cat.cond.spare"))}</span></button>`).firstElementChild;
      b.onclick = () => { drawType = k; preview = { kind: "cond", key: k }; setMode("draw"); };
      // A template has no datasheet of its own: the ⓘ shows the cable inside it,
      // for an empty spare duct the buying advice for the tab.
      return catCard(b, "cond", k, cabs[0]
        ? () => showProductInfo("cable", cabs[0].type)
        : () => showInfo(CAT_TABS.find(x => x.id === "cond")));
    });
  }
  const FILL = { cam: fillCams, ap: fillAps, jb: fillJbs, gear: fillGear, cond: fillConds };
  // Native <dialog> instead of a hand-rolled overlay.
  // Buying advice per tab — lives in the ⓘ dialog, not the panel.
  const GUIDE = {
    "cond": { de: "<h3>Rohre</h3>\n<ul>\n<li><b>DN 50</b> (50 mm außen) reicht für ein Glasfaser- und ein Cat-Kabel bequem; <b>DN 63</b>, wenn mehr hinein soll oder ein Reserverohr fehlt. Glatte Innenwand, Zugdraht mitbestellen, Bögen weit — kein 90°-Knick.</li>\n<li><b>Jedes Rohr hat seinen eigenen Typ</b> und seinen eigenen Preis: im selben Graben darf ein DN 63 für Strom neben einem DN 50 für Daten liegen. Der Graben selbst kostet die Erdarbeit, je Meter einmal.</li>\n<li><b>Kabel ohne Rohr</b> ist eine eigene Art (Werkzeug „Kabel“, C): ein Kabelzug an der Wand, im Keller, über den Dachboden oder als Freileitung — kein Graben, keine Erdarbeit, aber mehrere Kabel dürfen im selben Bündel liegen. Erdkabel direkt in Sand gehört auch hierher: nur für Strom (NYY) und nur, wenn nie wieder etwas nachgezogen werden soll.</li>\n<li><b>Zwei Rohre, ein Graben:</b> Strom und Daten getrennt führen. Auf der Karte: „Rohre“ hochsetzen — der Strich wird breiter mit heller Mittellinie.</li>\n</ul>\n<h3>Kabel</h3>\n<ul>\n<li><b>Glasfaser SM, 4 Fasern:</b> Singlemode-Kabel, vorkonfektioniert mit LC-Steckern, wird als Ganzes durchgezogen. Braucht an beiden Enden ein SFP-Modul (Fixkosten). Länge ist praktisch egal, kein Blitzschutz nötig — Glas leitet nicht.</li>\n<li><b>Cat6A:</b> Kupfer-Netzwerkkabel, trägt Daten <em>und</em> PoE-Strom. Grenze 90 m. Zwischen Gebäuden nur mit Überspannungsschutz an beiden Enden (Blitz koppelt in Kupfer ein) — deshalb dort lieber Glasfaser.</li>\n<li><b>NYY-J 5×2,5 mm²:</b> das deutsche Standard-Erdkabel für 230/400 V, auch Drehstrom (0,6/1 kV). Für mehr Leistung größerer Querschnitt — Tabelle beim ⓘ am Kabel. N = Normleitung, Y = PVC-Isolierung, Y = PVC-Mantel, J = mit grün-gelbem Schutzleiter; 5 Adern à 2,5 mm² (Drehstrom oder zwei Stromkreise). Anschluss, FI und Abnahme macht der Elektriker.</li>\n</ul>\n<h3>Graben</h3>\n<ul>\n<li>60–80 cm tief, 10 cm Sandbett unten und oben, dann Trassenwarnband, dann Aushub. Unter Fahrwegen tiefer und mit Rohr.</li>\n<li>Strom und Datenkabel im selben Graben, aber in getrennten Rohren oder mit 20 cm Abstand.</li>\n<li>Jeder Richtungswechsel ist eine Ziehstelle: Schacht oder Dose setzen, nicht um die Ecke ziehen.</li>\n</ul>\n<p class=\"tip\">Glasfaser wird am Abzweig nicht geteilt. Zwei Ziele = zwei Kabel im Stammrohr; am Faserende steht ein Switch oder Medienkonverter.</p>",
      en: "<h3>Pipes</h3>\n<ul>\n<li><b>DN 50</b> (50 mm outer) comfortably takes one fibre and one Cat cable; <b>DN 63</b> when more has to go in or there is no spare pipe. Smooth bore, order a draw wire, wide bends — never a 90° elbow.</li>\n<li><b>Every pipe has its own type</b> and its own price: in the same trench a DN 63 for power may sit next to a DN 50 for data. The trench itself costs the earthwork, once per metre.</li>\n<li><b>Cable without a conduit</b> is a kind of its own (the “Cable” tool, C): a run along a wall, through the cellar, across the loft or overhead — no trench, no earthwork, but several cables may share one bundle. Buried cable straight into sand belongs here too: power (NYY) only, and only if nothing will ever be pulled again.</li>\n<li><b>Two pipes, one trench:</b> keep power and data apart. On the map: raise “pipes” — the line gets wider with a light lane in the middle.</li>\n</ul>\n<h3>Cables</h3>\n<ul>\n<li><b>Fibre SM, 4 cores:</b> single-mode cable, pre-terminated with LC connectors, pulled through as one piece. Needs an SFP module at each end (the fixed cost). Length hardly matters, no lightning protection needed — glass does not conduct.</li>\n<li><b>Cat6A:</b> copper network cable, carries data <em>and</em> PoE power. Limit 90 m. Between buildings only with surge protection at both ends (lightning couples into copper) — hence fibre is preferred there.</li>\n<li><b>NYY-J 5×2.5 mm²:</b> the standard German buried power cable for 230/400 V, three-phase included (0.6/1 kV). More power needs a larger cross-section — see the table behind ⓘ at the cable. N = standard cable, Y = PVC insulation, Y = PVC sheath, J = with green-yellow protective earth; 5 cores of 2.5 mm² (three-phase or two circuits). Connection, RCD and sign-off are the electrician’s job.</li>\n</ul>\n<h3>Trench</h3>\n<ul>\n<li>60–80 cm deep, 10 cm of sand below and above, then warning tape, then backfill. Deeper and in a pipe under driveways.</li>\n<li>Power and data cables in the same trench, but in separate pipes or 20 cm apart.</li>\n<li>Every change of direction is a pulling point: set a shaft or box, do not pull around the corner.</li>\n</ul>\n<p class=\"tip\">Fibre is not split at a branch. Two destinations = two cables in the trunk; a switch or media converter sits at the fibre end.</p>" },
    "cam": { de: "<h3>Worauf es ankommt</h3>\n<ul>\n<li><b>Auflösung.</b> 4K (8 MP) erkennt Gesichter und Kennzeichen bis etwa 10–15 m; 2K/5 MP reicht für Übersicht und Nebeneingänge. Mehr Pixel heißt auch mehr Speicher und mehr Last auf dem Rekorder.</li>\n<li><b>Sichtfeld.</b> 80–90° ist „normal“ und trägt weit; ab 105° wird es breit, Details gehen früher verloren. 180° (zwei Sensoren) ist Übersicht ohne Identifikation. PTZ sieht immer nur dorthin, wo sie gerade steht — nie als einzige Kamera.</li>\n<li><b>Nachtsicht.</b> IR ist schwarz-weiß und unsichtbar; Flutlicht/Spotlight liefert Farbe, schreckt ab und blendet Nachbarn. Herstellerangaben sind Bestwerte — real etwa zwei Drittel.</li>\n<li><b>Strom.</b> PoE (802.3af, 15 W) reicht für Bullet, Turret, Dome. PoE+ (802.3at, 30 W) für PTZ, Heizung, Flutlicht; PoE++ (802.3bt) für große PTZ. Ein Cat-Kabel trägt Strom und Bild — deshalb Cat im Leerrohr. WLAN-Kameras brauchen trotzdem eine Steckdose.</li>\n<li><b>Gehäuse.</b> Außen IP66/IP67, IK10 nur dort, wo jemand zuschlagen kann. Turret und Dome unter Vordach oder Decke; Bullet mit Sonnenblende freistehend.</li>\n<li><b>Aufzeichnung.</b> UniFi läuft in Protect auf UNVR, UCG oder UDM — ohne Abo. Reolink zeichnet auf eigenem NVR oder SD auf; per ONVIF/RTSP auch in Protect (nur Bild, keine Protect-Erkennung). Netatmo speichert auf SD und in die App — kein NVR, kein ONVIF, nicht mischbar.</li>\n</ul>\n<h3>Hersteller</h3>\n<ul>\n<li><b>UniFi.</b> Ein System: Kameras, Switches, Rekorder, eine Oberfläche, beste Erkennung. Dafür der höchste Preis je Kamera und nur mit UniFi-Rekorder.</li>\n<li><b>Reolink.</b> Etwa der halbe Preis bei ähnlicher Bildqualität, offen (ONVIF, RTSP), eigener NVR günstig. App und Erkennung weniger poliert. Nur PoE-Modelle nehmen — keine 12-V-Varianten mit Netzteil.</li>\n<li><b>Netatmo.</b> Smart-Home-Kamera: ersetzt die Außenleuchte an der Haustür, Gesichtserkennung, kein Abo. Gut für ein einzelnes Gerät, nicht für ein Kamerasystem mit Rekorder.</li>\n</ul>\n<p class=\"tip\">Faustregel: Übersicht mit wenigen breiten Kameras, dazu je eine „normale“ auf jeden Zugang (Tor, Haustür, Hof). Zoom oder PTZ erst, wenn es eine konkrete Stelle gibt, die man heranholen muss.</p>",
      en: "<h3>What matters</h3>\n<ul>\n<li><b>Resolution.</b> 4K (8 MP) identifies faces and plates out to roughly 10–15 m; 2K/5 MP is enough for overview and side doors. More pixels also means more storage and more load on the recorder.</li>\n<li><b>Field of view.</b> 80–90° is “normal” and carries far; from 105° it gets wide and detail fades sooner. 180° (two sensors) is overview without identification. A PTZ only ever sees where it happens to point — never as the only camera.</li>\n<li><b>Night vision.</b> IR is black-and-white and invisible; a floodlight or spotlight gives colour, deters, and dazzles the neighbours. Manufacturer ranges are best case — count on two thirds.</li>\n<li><b>Power.</b> PoE (802.3af, 15 W) covers bullet, turret and dome. PoE+ (802.3at, 30 W) for PTZ, heaters, floodlights; PoE++ (802.3bt) for large PTZ. One Cat cable carries power and video — hence Cat in the conduit. Wi-Fi cameras still need a socket.</li>\n<li><b>Housing.</b> Outdoors IP66/IP67; IK10 only where someone can reach and hit it. Turret and dome under eaves or a ceiling; a bullet with its sunshade stands free.</li>\n<li><b>Recording.</b> UniFi runs in Protect on a UNVR, UCG or UDM — no subscription. Reolink records to its own NVR or SD; via ONVIF/RTSP also into Protect (video only, no Protect detections). Netatmo records to SD and the app — no NVR, no ONVIF, cannot be mixed.</li>\n</ul>\n<h3>Vendors</h3>\n<ul>\n<li><b>UniFi.</b> One system: cameras, switches, recorder, one interface, the best detection. Highest price per camera and only with a UniFi recorder.</li>\n<li><b>Reolink.</b> About half the price for similar image quality, open (ONVIF, RTSP), cheap own NVR. App and detection less polished. Take PoE models only — no 12 V variants with a power brick.</li>\n<li><b>Netatmo.</b> Smart-home camera: replaces the outdoor light at the front door, face recognition, no subscription. Good for a single device, not for a camera system with a recorder.</li>\n</ul>\n<p class=\"tip\">Rule of thumb: overview with a few wide cameras, plus one “normal” camera on every access (gate, front door, yard). Zoom or PTZ only once there is a specific spot that has to be pulled in.</p>" },
    "ap": { de: "<h3>Worauf es ankommt</h3>\n<ul>\n<li><b>Wi-Fi 7 gegen Wi-Fi 6.</b> Die Reichweite ist praktisch gleich. Der Unterschied ist Durchsatz nahe am Gerät und das 6-GHz-Band — das trägt kurz und ist nur innen sinnvoll. Draußen zählen 2,4 GHz und das Gehäuse.</li>\n<li><b>Reichweite.</b> Freifeld 30–50 m, jede Wand halbiert. Lieber zwei kleine APs als ein starker: Sendeleistung runter, Kanäle trennen. Auf 2,4 GHz nur 1, 6 und 11.</li>\n<li><b>Kabel schlägt Mesh.</b> Wo Cat liegt, immer per Kabel anbinden — ein Mesh-Backhaul frisst die Hälfte der Bandbreite und die Hälfte der Stabilität.</li>\n<li><b>PoE.</b> Innen-APs laufen mit 802.3af, Außen-APs brauchen 802.3at. Der Switch am anderen Ende muss das liefern.</li>\n<li><b>Bauform.</b> Rundstrahler an Decke oder Außenwand für Hof und Weide; Richtantenne, wenn eine Seite gezielt weit abgedeckt werden soll (Stall, Feldweg).</li>\n</ul>\n<h3>Hersteller</h3>\n<ul><li><b>UniFi / TP-Link Omada / MikroTik:</b> PoE-APs für Decke oder Außenwand, ein Kabel für Strom und Daten, Controller-Verwaltung. Innerhalb eines Herstellers bleiben.</li><li><b>AVM FRITZ!:</b> Repeater als AP an der Steckdose, per LAN an die FRITZ!Box. Bequem, wenn die FRITZ!Box ohnehin der Router ist; kein PoE, nichts für draußen, keine Kamera-Aufzeichnung.</li><li>Reolink und Netatmo bauen keine Access Points.</li></ul>\n<p class=\"tip\">Ein AP je Etage oder Gebäudeteil innen, ein Außen-AP je Hofseite — und Kabel dorthin, wo er hängt.</p>",
      en: "<h3>What matters</h3>\n<ul>\n<li><b>Wi-Fi 7 vs Wi-Fi 6.</b> Range is practically the same. The difference is throughput close to the device and the 6 GHz band — short reach, only useful indoors. Outdoors, 2.4 GHz and the housing decide.</li>\n<li><b>Range.</b> Free field 30–50 m, every wall halves it. Two small APs beat one strong one: turn power down, separate channels. On 2.4 GHz use only 1, 6 and 11.</li>\n<li><b>Cable beats mesh.</b> Wherever Cat is laid, wire it — a mesh backhaul eats half the bandwidth and half the stability.</li>\n<li><b>PoE.</b> Indoor APs run on 802.3af, outdoor APs need 802.3at. The switch at the other end has to deliver it.</li>\n<li><b>Form factor.</b> Omnidirectional on a ceiling or outside wall for yard and paddock; directional when one side must be covered far and on purpose (stable, track).</li>\n</ul>\n<h3>Vendors</h3>\n<ul><li><b>UniFi / TP-Link Omada / MikroTik:</b> PoE APs for ceiling or outside wall, one cable for power and data, controller management. Stay within one vendor.</li><li><b>AVM FRITZ!:</b> repeaters as APs at a socket, wired to the FRITZ!Box. Convenient if the FRITZ!Box is the router anyway; no PoE, nothing for outdoors, no camera recording.</li><li>Reolink and Netatmo do not make access points.</li></ul>\n<p class=\"tip\">One AP per floor or wing indoors, one outdoor AP per yard side — and a cable to wherever it hangs.</p>" },
    "hub": { de: "<h3>Was in die Zentrale geh\u00f6rt</h3>\n<ul>\n<li><b>Ein Router.</b> Er bringt den Anschluss ins Haus und vergibt die Adressen — ohne ihn kommt weder Kupfer noch Glasfaser an. Ein Router je Plan.</li>\n<li><b>Glasfaser braucht einen SFP-Port.</b> Entweder im Router (beim UCG Fiber l\u00e4sst sich einer der beiden SFP+ auf LAN umstellen; bei jeder FRITZ!Box ist der SFP-Schacht der <em>WAN</em>-Anschluss), oder in einem Switch mit SFP, oder \u00fcber einen Medienkonverter davor.</li>\n<li><b>Medienkonverter arbeiten in beide Richtungen.</b> Einer je Faserende — au\u00dfer das Ger\u00e4t dort hat selbst einen SFP-Schacht. Je Faserkabel stecken zwei SFP-Module, die rechnet der Kanal schon mit.</li>\n<li><b>Ein PoE-Switch,</b> sobald Kameras oder Access Points direkt an der Zentrale h\u00e4ngen. Das UCG Fiber gibt 30 W ab, das reicht f\u00fcr genau eine Kamera; alles dar\u00fcber braucht einen Switch.</li>\n<li><b>Ein Rekorder.</b> Das UCG Fiber zeichnet selbst auf (rund f\u00fcnf 4K-Kameras). Mit einer FRITZ!Box als Router braucht es zus\u00e4tzlich einen UNVR — sie zeichnet nichts auf.</li>\n<li><b>\u00dcberspannungsschutz</b> an jedem Kupferkabel, das von drau\u00dfen hereinkommt. Zwischen Geb\u00e4uden lieber gleich Glasfaser: die tr\u00e4gt keinen Blitz herein.</li>\n</ul>",
      en: "<h3>What belongs in the head end</h3>\n<ul>\n<li><b>A router.</b> It brings the line into the building and hands out addresses — without one neither copper nor fibre arrives. One router per plan.</li>\n<li><b>Fibre needs an SFP port.</b> Either in the router (on the UCG Fiber one of the two SFP+ can be switched to LAN; on every FRITZ!Box the SFP cage is the <em>WAN</em> port), or in a switch with SFP, or through a media converter in front of it.</li>\n<li><b>Media converters work both ways.</b> One per fibre end — unless the device there has an SFP cage of its own. Every fibre cable carries two SFP modules, and the conduit already counts them.</li>\n<li><b>A PoE switch</b> as soon as cameras or access points hang straight off the head end. The UCG Fiber hands out 30 W, enough for exactly one camera; anything more needs a switch.</li>\n<li><b>A recorder.</b> The UCG Fiber records by itself (about five 4K cameras). With a FRITZ!Box as the router you also need a UNVR — it records nothing.</li>\n<li><b>Surge protection</b> on every copper cable coming in from outside. Between buildings prefer fibre: it carries no lightning indoors.</li>\n</ul>" },
    "gear": { de: "<h3>Router und Rekorder</h3>\n<ul>\n<li><b>UniFi Cloud Gateway Fiber:</b> Router, Netzwerk-Controller und Protect-Rekorder in einem Gerät, mit zwei SFP+-Ports. Ein Kasten für alles — vorausgesetzt, die Kameras kommen von UniFi.</li>\n<li><b>FRITZ!Box:</b> Router mit WLAN und Telefonie, aber ohne jede Kamera-Aufzeichnung. Wer sie als Router nimmt, braucht für die Kameras zwingend einen UNVR daneben.</li>\n<li><b>UNVR:</b> eigener Rekorder mit vier Plattenschächten. Nötig ab etwa sechs 4K-Kameras, bei langer Vorhaltezeit — oder eben immer dann, wenn kein UniFi-Gateway im Plan steht.</li>\n</ul>\n<h3>Speicher</h3>\n<ul>\n<li>Faustregel je 4K-Kamera: <b>1 bis 1,5 TB im Monat</b> bei Daueraufnahme. Nur bei Bewegung aufzuzeichnen drückt das auf etwa ein Drittel.</li>\n<li>Vorhaltezeit festlegen, dann rechnen: 30 Tage sind der übliche Ansatz. Vier 4K-Kameras, 30 Tage, Bewegung — das sind rund 2 TB.</li>\n<li>Platten der <b>Surveillance-Klasse</b> nehmen (WD Purple, Seagate SkyHawk). Sie sind auf Dauerschreiben ausgelegt, Desktop-Platten gehen daran kaputt.</li>\n</ul>\n<h3>Kleinmaterial</h3>\n<ul>\n<li>Dosen, Kabeleinführungen, kurze Cat6A-Strecken im Gebäude und Halterungen tauchen auf jeder Rechnung auf — und in keiner Planung.</li>\n<li><b>Überspannungsschutz</b> an jedem Kupferkabel, das zwischen zwei Gebäuden läuft, und zwar an beiden Enden. Glasfaser braucht ihn nicht.</li>\n</ul>\n<h3>Am Abzweigpunkt</h3>\n<ul>\n<li><b>Faser weiterverteilen:</b> ein Switch mit zwei oder mehr SFP-Sch\u00e4chten nimmt die ankommende Faser an und gibt weitere Fasern ab — gespleißt wird dabei nichts.</li>\n<li><b>Strom im Schacht:</b> Switch, Medienkonverter und Injektor haben ein eigenes Netzteil und brauchen dort 230 V. Entweder ein NYY-J im selben Graben — oder ein PoE-gespeistes Ger\u00e4t, das am Netzwerkkabel h\u00e4ngt.</li>\n</ul>\n<p class=\"tip\">Diese Teile stehen nicht auf der Karte. Ein Klick im Katalog zählt ein Stück hoch, die Menge steht danach im Auswahl-Panel.</p>",
      en: "<h3>Router and recorder</h3>\n<ul>\n<li><b>UniFi Cloud Gateway Fiber:</b> router, network controller and Protect recorder in one box, with two SFP+ ports. One box for everything — as long as the cameras are UniFi.</li>\n<li><b>FRITZ!Box:</b> a router with Wi-Fi and telephony, but no camera recording at all. Using one as the router makes a UNVR mandatory for the cameras.</li>\n<li><b>UNVR:</b> a recorder of its own with four drive bays. Needed from about six 4K cameras, with long retention — or simply whenever no UniFi gateway is in the plan.</li>\n</ul>\n<h3>Storage</h3>\n<ul>\n<li>Rule of thumb per 4K camera: <b>1 to 1.5 TB a month</b> when recording continuously. Recording on motion only brings that down to roughly a third.</li>\n<li>Decide the retention first, then do the maths: 30 days is the usual figure. Four 4K cameras, 30 days, motion only — about 2 TB.</li>\n<li>Use <b>surveillance-class</b> drives (WD Purple, Seagate SkyHawk). They are built for continuous writing; desktop drives die of it.</li>\n</ul>\n<h3>Small parts</h3>\n<ul>\n<li>Outlets, cable entries, short indoor Cat6A runs and brackets show up on every invoice — and in no plan.</li>\n<li><b>Surge protection</b> on every copper cable that runs between two buildings, at both ends. Fibre does not need it.</li>\n</ul>\n<h3>At a junction point</h3>\n<ul>\n<li><b>Passing fibre on:</b> a switch with two or more SFP cages takes the incoming fibre and hands further fibres out — nothing is spliced.</li>\n<li><b>Power in a shaft:</b> a switch, media converter or injector carries its own mains adapter and needs 230 V there. Either an NYY-J in the same trench — or a PoE-powered device that hangs on the network cable.</li>\n</ul>\n<p class=\"tip\">These parts are not on the map. A click in the catalogue counts one more; the quantity then sits in the selection panel.</p>" },
  };
  // One datasheet for everything: camera, access point, housing, device, item from the
  // hub, and cable. Every ⓘ in the app goes through here — name, properties,
  // full text and, where there's something to buy, the product box.
  const catEntry = (kind, key) => kind === "gear" ? INFRA.find(x => x.id === key)
    : (kind === "cable" ? CABLES[key] : (kind === "cond" ? CONDUITS[key] : (CATALOG[kind] || {})[key]));
  function showProductInfo(kind, key) {
    const m = catEntry(kind, key), dlg = $("infoDlg");
    if (!m || !dlg) return;
    // A router has its own rows, a cable none at all — there the body text carries everything.
    const sk = kind === "gear" ? (m.role === "router" ? "router" : null) : (kind === "cable" ? null : kind);
    const parts = [sk ? specList(sk, m) : ""];
    if (kind === "cable") {
      parts.push(m.info ? tx(m.info) : `<p>${esc(tx(m.note))}</p>`);
      parts.push(`<p class="note">${esc(t("cable.cost", { m: m.m.toFixed(2), fixed: m.fixed }))}</p>`);
    } else {
      if (m.price != null) parts.push(`<dl class="spec"><dt>${esc(t("gear.unit"))}</dt><dd>${m.price} €</dd></dl>`);
      // "Good for" / "Less suited" used to be in the panel — it belongs on the datasheet, not in the controls.
      const w = whenOf(kind, key), ww = w ? tx(w) : null;
      if (ww) parts.push(`<dl class="spec advice">
        <dt>${esc(t("prev.yes"))}</dt><dd class="ok"><span class="mk">✓</span>${esc(ww.yes)}</dd>
        <dt>${esc(t("prev.no"))}</dt><dd class="warn"><span class="mk">!</span>${esc(ww.no)}</dd>
      </dl>`);
      const lead = m.use ? tx(m.use) : (kind === "gear" ? tx(m.sub) : "");
      parts.push(`<p class="note">${lead ? `<b>${esc(lead)}.</b> ` : ""}${esc(tx(m.note) || "")}`
        + `${kind === "ap" ? " " + esc(t("ap.range", { r: m.radius })) : ""}</p>`);
    }
    // A cable has neither a product page nor an image — then the box stays away.
    if (m.url || m.img || m.price) parts.push(productBox(kind, key, m));
    setText("infoHead", tx(m.name));
    setHtml("infoBody", parts.join(""));
    try { dlg.showModal(); } catch (e) { dlg.open = true; }
  }
  function showGuide(id, head) {
    const dlg = $("infoDlg");
    if (!dlg || !GUIDE[id]) return;
    setText("infoHead", head);
    setHtml("infoBody", tx(GUIDE[id]));
    try { dlg.showModal(); } catch (e) { dlg.open = true; }
  }
  function showInfo(tab) {
    const dlg = $("infoDlg"); if (!dlg) return;
    setText("infoHead", t(tab.label));
    const parts = [`<p>${esc(t(tab.note))}</p>`];
    if (tab.id === "jb") parts.push(`<p class="tip">${esc(t("cat.jbs.hint"))}</p>`);
    if (GUIDE[tab.id]) parts.push(tx(GUIDE[tab.id]));
    setHtml("infoBody", parts.join(""));
    try { dlg.showModal(); } catch (e) { dlg.open = true; }
  }
  $("infoClose").onclick = () => closeDlg($("infoDlg"));

  // ---------- Hover card: the short version, one node, no state ----------
  // It appears after a short delay over anything carrying a data-hover="<kind>:<key>"
  // attribute: catalog cards, device and cable rows, selection fields. Image, name, price, one
  // line of stats, two sentences — datasheet, product link and buying advice stay in the ⓘ dialog.
  const HOVER_WAIT = 350, HOVER_CHARS = 220;
  let hoverTimer = null, hoverNode = null;
  function hideHover() {
    clearTimeout(hoverTimer); hoverNode = null;
    const n = $("hovercard"); if (n) n.hidden = true;
  }
  function showHover(kind, key, anchor) {
    const m = catEntry(kind, key), n = $("hovercard");
    if (!m || !n || !anchor || !anchor.isConnected) return;
    // A conduit template has no text of its own — then the cable inside it speaks.
    const lead = kind === "cond" ? condCables(m)[0] : null;
    let note = String(tx(m.note) || tx(m.use) || tx(m.sub) || (lead ? tx(CABLES[lead.type].note) : "") || "")
      .replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
    if (note.length > HOVER_CHARS) note = note.slice(0, HOVER_CHARS).replace(/\s\S*$/, "") + " …";
    const hint = optHint(kind, key);
    // Without a price and without a catalog image there's no product photo — then the placeholder stays off.
    const shot = (m.img || m.price) ? imgUrl(kind, key, m) : "";
    n.innerHTML = (shot ? `<img src="${esc(shot)}" alt="" loading="lazy" onerror="this.remove()">` : "")
      + `<div class="hh"><span class="hn">${esc(tx(m.name))}</span>`
      + (m.price != null ? `<span class="hp">${m.price} €</span>` : "") + `</div>`
      + (hint ? `<div class="hk">${esc(hint)}</div>` : "")
      + (note ? `<div class="hd">${esc(note)}</div>` : "");
    n.hidden = false;
    // Next to the trigger, but kept inside the viewport: to the right, otherwise to the left.
    const a = anchor.getBoundingClientRect(), b = n.getBoundingClientRect(), pad = 8;
    let x = a.right + pad;
    if (x + b.width > innerWidth - pad) x = a.left - pad - b.width;
    n.style.left = Math.max(pad, Math.min(x, innerWidth - pad - b.width)) + "px";
    n.style.top = Math.max(pad, Math.min(a.top, innerHeight - pad - b.height)) + "px";
  }
  // An <option> has no hover. So the card attaches to the field and shows what's selected.
  function hoverSel(s, kind) {
    if (!s) return;
    const set = () => s.setAttribute("data-hover", kind + ":" + s.value);
    set();
    s.addEventListener("change", () => {
      set();
      const n = $("hovercard");
      if (n && !n.hidden) showHover(kind, s.value, s);
    });
  }
  {
    // On a touch device there's no hover — the ⓘ is enough there.
    const coarse = () => typeof matchMedia === "function" && matchMedia("(pointer: coarse)").matches;
    const over = (e) => {
      const a = e.target.closest && e.target.closest("[data-hover]");
      if (a === hoverNode) return;
      hideHover();
      if (!a || coarse()) return;
      hoverNode = a;
      const v = a.getAttribute("data-hover"), i = v.indexOf(":");
      hoverTimer = setTimeout(() => showHover(v.slice(0, i), v.slice(i + 1), a), HOVER_WAIT);
    };
    // mouseenter doesn't bubble, but still reaches the document in the capture phase.
    document.addEventListener("mouseover", over);
    document.addEventListener("mouseenter", over, true);
    document.addEventListener("mouseout", (e) => { if (hoverNode && !hoverNode.contains(e.relatedTarget)) hideHover(); });
    document.addEventListener("mouseleave", (e) => { if (e.target === hoverNode) hideHover(); }, true);
    ["pointerdown", "wheel", "scroll"].forEach(k => document.addEventListener(k, hideHover, true));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideHover(); }, true);
  }

  // Large product image: 0 = fit, otherwise width as a multiple of the area.
  // Works as a magnifier — a full pan-and-zoom tool would be overkill for a product photo.
  let imgZoom = 0;
  function setImgZoom(z) {
    const im = $("imgBig"), wrap = $("imgWrap"); if (!im) return;
    // Remember the center so the visible crop doesn't jump when zooming.
    const rx = im.offsetWidth ? (wrap.scrollLeft + wrap.clientWidth / 2) / im.offsetWidth : 0.5;
    const ry = im.offsetHeight ? (wrap.scrollTop + wrap.clientHeight / 2) / im.offsetHeight : 0.5;
    imgZoom = Math.max(0, Math.min(8, z));
    if (!imgZoom) { im.style.width = ""; im.style.maxWidth = "100%"; im.style.maxHeight = "100%"; }
    else { im.style.maxWidth = "none"; im.style.maxHeight = "none"; im.style.width = Math.round(imgZoom * 100) + "%"; }
    if (imgZoom) {
      wrap.scrollLeft = rx * im.offsetWidth - wrap.clientWidth / 2;
      wrap.scrollTop = ry * im.offsetHeight - wrap.clientHeight / 2;
    }
  }
  function showImage(src, title) {
    const d = $("imgDlg"); if (!d) return;
    setText("imgHead", title || "");
    $("imgBig").src = src; $("imgBig").alt = title || "";
    setImgZoom(0);
    try { d.showModal(); } catch (e) { d.open = true; }
  }
  $("imgIn").onclick = () => setImgZoom(imgZoom ? imgZoom * 1.5 : 1.5);
  $("imgOut").onclick = () => setImgZoom(imgZoom <= 1.5 ? 0 : imgZoom / 1.5);
  $("imgFit").onclick = () => setImgZoom(0);
  $("imgClose").onclick = () => closeDlg($("imgDlg"));
  function closeDlg(d) { if (!d) return; try { d.close(); } catch (e) { d.open = false; } }
  // A click on the backdrop closes it. That hits the <dialog> itself, so
  // additionally check whether the pointer was actually outside the box.
  function closeOnBackdrop(d) {
    if (!d) return;
    d.addEventListener("click", (e) => {
      if (e.target !== d) return;
      const r = d.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeDlg(d);
    });
  }
  closeOnBackdrop($("imgDlg"));
  closeOnBackdrop($("infoDlg"));
  closeOnBackdrop($("helpDlg"));
  closeOnBackdrop($("expDlg"));

  // Quick guide inside the app. The long version lives at /help — both texts
  // must be updated together whenever the controls change.
  const HELP = [
    ["help.tools", [
      ["V", "help.tool.select"], ["K", "help.tool.cam"], ["A", "help.tool.ap"],
      ["J", "help.tool.jb"], ["H", "help.tool.hub"], ["L", "help.tool.cond"], ["C", "help.tool.cable"],
    ]],
    ["help.keys", [
      ["Strg+Z / Strg+Y", "help.key.undo"], ["Entf", "help.key.del"],
      ["Esc", "help.key.esc"], ["⏎", "help.key.enter"],

  // What belongs on the sheet — same data for print and PDF.

    c.aps.forEach(i => { const m = APS[i.model]; add(i.label, m.name, [i.note, m.wifi, via(i.id)].filter(Boolean).join(" · ")); });
    c.hubs.forEach(i => { const rt = hubRouter(); add(i.label, `${t("hub.router")}: ${rt ? tx(rt.name) : t("hub.router.none")}`, [i.note, gearNames(i), via(i.id)].filter(Boolean).join(" · ")); });
    c.jbs.forEach(i => { const m = JUNCTIONS[i.model]; add(i.label, tx(m.name), [i.note, gearNames(i) || tx(m.use), via(i.id)].filter(Boolean).join(" · ")); });
    c.conds.forEach(i => add(i.label, condName(i), fmtM(i.c.len)));

    const grp = (arr, cat) => { const g = {}; arr.forEach(i => { g[i.model] = (g[i.model] || 0) + 1; }); for (const k in g) if (cat[k].price) bom.push({ name: tx(cat[k].name), qty: g[k] + " ×", amount: cat[k].price * g[k] }); };
    grp(c.cams, CAMS); grp(c.aps, APS); grp(c.jbs, JUNCTIONS);
    const gg = jbGearGroups(c.jbs.concat(c.hubs));
    for (const k in gg) bom.push({ name: tx(JUNCTIONS[k].name), qty: gg[k] + " ×", amount: JUNCTIONS[k].price * gg[k] });
    c.conds.forEach(i => bom.push({ name: `${i.label} — ${condName(i)}`, qty: fmtM(i.c.len), amount: i.c.total }));
    c.infra.forEach(i => bom.push({ name: tx(i.name), qty: i.qty + " ×", amount: i.price * i.qty }));
    const sums = [[t("cost.sum.cams"), c.sumCams], [t("cost.sum.aps"), c.sumAps], [t("cost.sum.jbs"), c.sumJbs], [t("cost.sum.cond"), c.sumCond], [t("cost.sum.infra"), c.sumInfra]];

    [...c.cams.map(i => CAMS[i.model]), ...c.aps.map(i => APS[i.model]), ...c.jbs.map(i => JUNCTIONS[i.model]),

  // The whole plan lives in the link — no server, no account. deflate-raw if the

  const b64url = {

    dec: (str) => { const raw = atob(str.replace(/-/g, "+").replace(/_/g, "/")); const out = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i); return out; },

    if (typeof Ctor !== "function") return null;

    catch (e) { setStatus(t("share.failed")); }

  // ---------- Persistence ----------
  // ---------- Undo / Redo ----------
  // The working state is small and serializable, so snapshots are enough.
  // ponytail: no command pattern — JSON copies, capped at HIST_MAX.
  const HIST_MAX = 60;
  const HIST_KEYS = ["items", "conduits", "infra", "budget", "earthwork", "seq"];
  let past = [], future = [], histNow = null;
  function snapState() { const o = {}; HIST_KEYS.forEach(k => o[k] = state[k]); return JSON.stringify(o); }
  function histInit() { past = []; future = []; histNow = snapState(); updateHist(); }

    const s2 = snapState();

    if (s2 === histNow) return;
    past.push(histNow); if (past.length > HIST_MAX) past.shift();
    future.length = 0; histNow = s2; updateHist();
  }
  function histApply(s2) {
    Object.assign(state, JSON.parse(s2));

    syncBonds(); renderMap(); renderSide(); updateHint(); updateHist(); scheduleSave();
  }
  function undo() { if (!past.length) return; future.push(histNow); histApply(past.pop()); }
  function redo() { if (!future.length) return; past.push(histNow); histApply(future.pop()); }
  function updateHist() {
    const u = $("t-undo"), r = $("t-redo");
