  // Position in meters (EPSG:25832) on every element and conduit point: that's what gets saved
  // and shared. x/y are just the pixel cache for it and get recomputed from e/n whenever
  // a plan's raster origin differs. That way nothing drifts with the origin anymore.
  function stampGeo(st) {
    const put = (o) => { o.e = +px2e(o.x).toFixed(2); o.n = +px2n(o.y).toFixed(2); };
    (st.items || []).forEach(put);
    (st.conduits || []).forEach(c => (c.points || []).forEach(put));
    return st;
  }
  function unstampGeo(st) {
    const take = (o) => { if (Number.isFinite(+o.e) && Number.isFinite(+o.n)) { o.x = +e2px(+o.e).toFixed(1); o.y = +n2px(+o.n).toFixed(1); } };
    (st.items || []).forEach(take);
    (st.conduits || []).forEach(c => (c.points || []).forEach(take));
    return st;
  }
  // A plan from before state.geo carries pixels tied to an origin that no longer exists.
  // But the house node knows its address: the origin gets recomputed from that.
  async function migrateLegacyGeo() {
    const hub = state.items.find(i => i.kind === "hub" && (i.note || "").trim());
    if (!hub) return false;
    try {
      const hits = await geoLookup(hub.note);
      if (!hits || !hits.length) return false;
      const u = UTM.fwd(+hits[0].lat, +hits[0].lon);
      state.geo = { e0: +(u.e - hub.x / GEO.pxPerM).toFixed(2), n0: +(u.n + hub.y / GEO.pxPerM).toFixed(2) };
      useGeo(state.geo); stampGeo(state); resetTiles(); fit(); scheduleSave();
      setStatus(t("geo.migrated"));

    } catch (e) { return false; }
  }

  // ---------- Multiple plans ----------

  // Keys used to carry the old project prefix oh-; migrate them once to sl-.

  // then drop the old one. Idempotent — a second run finds nothing left to do.
  // The tile cache is keyed by name, so the old one is simply thrown away.
  function migrateKeys() {
    try {
      const old = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("oh-")) old.push(k);
      }
      old.forEach(k => {
        const to = "sl-" + k.slice(3);
        if (localStorage.getItem(to) === null) localStorage.setItem(to, localStorage.getItem(k));
        localStorage.removeItem(k);
      });

    try { if (typeof caches !== "undefined" && caches.delete) caches.delete("oh-wms-v1"); } catch (e) {}
  }

  // Server storage: the Astro endpoint /api/state holds the last working state
  // as a file. Without a running server (file:// or python -m http.server) the
  // probe returns null and it falls back to localStorage.
  async function serverDb() {
    try { const r = await fetch("/api/state", { cache: "no-store" }); if (!r.ok) return null; }
    catch (e) { return null; }
    const doc = {
      async get() {
        const r = await fetch("/api/state", { cache: "no-store" });
        const d = (r.ok && r.status !== 204) ? await r.json() : null;
        return { exists: !!d, data: () => d };
      },
      async set(v) {
        const r = await fetch("/api/state", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(v) });
        if (!r.ok) throw new Error("save failed");
      }
    };
    return { doc: () => doc };
  }

  async function boot() {

    catTab = CAT_TABS.some(x => x.id === state.catTab) ? state.catTab : "cam";
    catFacets = new Set(Array.isArray(state.catFacets) ? state.catFacets : []);
    applyStatic(); applyToolLabels(); applyShow(); applyLook(); fillBasemapSelect(); initLayout();
    restoreView(); renderMap(); renderSide(); updateHint(); histInit();
    setTimeout(() => { if (legacyGeo) { legacyGeo = false; migrateLegacyGeo(); } }, 0);
    // The URL carries the intent: new plan, specific plan, or a shared save.
    migrateLegacy();

    const wantNew = /[#&]new=1/.test(hash);
    const openId = (/[#&]o=([A-Za-z0-9_-]+)/.exec(hash) || [])[1];
    const addr = (/[#&]q=([^&]+)/.exec(hash) || [])[1];
    const ll = /[#&]ll=(-?[\d.]+),(-?[\d.]+)/.exec(hash);
    const label = (/[#&]n=([^&]+)/.exec(hash) || [])[1];
    const fromLink = await stateFromHash();
    try { if (hash) history.replaceState(null, "", location.pathname); } catch (e) {}

    let hadLocal = false;
    if (sane(fromLink)) {
      // A shared link becomes its own plan — it never overwrites someone else's.
      usePlan(newPlanId(), fromLink); touchIndex(); scheduleSave();
      setStatus(t("share.loaded"));
      hadLocal = true;
    } else if (wantNew) {
      createPlan();
      setStatus(t("status.ready"));
      hadLocal = true;   // otherwise the server save would lay its plan over the fresh one
    } else {
      let id = openId && readPlan(openId) ? openId : null;
      if (!id) { try { const cur = localStorage.getItem(CURRENT_KEY); if (cur && readPlan(cur)) id = cur; } catch (e) {} }
      if (!id) { const first = planIndex().find(e => readPlan(e.id)); if (first) id = first.id; }
      if (id) { usePlan(id, readPlan(id)); setStatus(t("status.loadedlocal")); hadLocal = true; }
      else { usePlan(newPlanId(), defaultState()); }
    }

    try {
      db = (window.claude && window.claude.use) ? await window.claude.use("db") : await serverDb(); dbReady = true;
      // The server has only one slot. So it may only step in when the
      // browser has nothing at all — otherwise it would overwrite the just-selected plan.
      if (db && !hadLocal) {
        const snap = await db.doc("plan/current").get();
        if (snap.exists && sane(snap.data())) { usePlan(planId, snap.data()); setStatus(t("status.loaded")); }
        else setStatus(t("status.ready"));
      } else setStatus(t(hadLocal ? "status.loadedlocal" : "status.ready"));
    } catch (e) { setStatus(t("status.nocloud")); }
    // Arrived from the homepage with a location: jump there — and for a
    // fresh plan, fill in the house connection, name, address, and parcel right away.
    let place = null;
    if (ll) place = { lat: +ll[1], lon: +ll[2], label: label ? decodeURIComponent(label) : "" };
    else if (addr) {
      try {
        const hits = await geoLookup(decodeURIComponent(addr));
        if (hits && hits.length) place = { lat: +hits[0].lat, lon: +hits[0].lon, label: shortPlace(hits[0]) };
        else setStatus(t("geo.none"));
      } catch (e) { setStatus(t("geo.failed")); }
    }
    if (place) {
      if (wantNew) await seedFromPlace(place);
      else { gotoLatLon(place.lat, place.lon); if (place.label) setStatus(place.label); }
    }
    booted = true;
  }
  boot();
})();
</script>
